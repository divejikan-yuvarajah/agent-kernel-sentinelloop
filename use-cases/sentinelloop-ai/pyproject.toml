[project]
name = "sentinelloop-ai"
version = "0.1.0"
description = "Multilingual workplace hazard reporting and closed-loop safety follow-up"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,api,openai,whatsapp,slack]>=0.6.0",
    "python-telegram-bot>=22.8",
    "qrcode[pil]>=8.2",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.6.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
